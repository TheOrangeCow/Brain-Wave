<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Brain Wave - Log in</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icon.ico') }}">
</head>

<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Brain Wave</h1>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <form method="POST">
        <input type="text" name="username" placeholder="Username" autofocus required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit" style="width:100%;">Log in</button>
      </form>
      <a href="{{ url_for('cow_login') }}" class="cow-btn">Login with Cow</a>
      <div class="switch">No account? <a href="/signup">Sign up</a></div>
    </div>
  </div>
</body>

</html>
