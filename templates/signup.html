<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Brain Wave - Sign up</title>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Brain Wave</h1>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <form method="POST">
        <input type="text" name="username" placeholder="Choose a username" autofocus required>
        <input type="password" name="password" placeholder="Choose a password" required>
        <input type="password" name="joincode" placeholder="Join Code" required>
        <input type="text" name="api_key" placeholder="Gemini API key (optional, add later in Settings)">
        <button type="submit" style="width:100%;">Create account</button>
      </form>
      <div class="switch">Already have an account? <a href="/login">Log in</a></div>
    </div>
  </div>
</body>

</html>
